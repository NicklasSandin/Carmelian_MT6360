# SPDX-License-Identifier: MIT
# Xiaomi Redmi Note 10 5G (camellian), first-light staging descriptor.
#
# The phone uses an Android boot image v2 with the DTB inside boot.img.  The
# generic Omarchy Mobile image and installer paths only support Android v4,
# so this descriptor intentionally remains ram-only until a dedicated,
# hardware-tested v2 packer exists.  Generic image/install/flash/push commands
# must refuse it before accessing a phone.

CODENAME=camellian
NAME="Xiaomi Redmi Note 10 5G"
USB_PRODUCT="Redmi Note 10 5G (first light)"
SOC=mt6833
COMPATIBLE="xiaomi,camellian"
BOOT_METHOD=ufs-root
PACKAGE=omamobile-device-camellian
ROOTFS_PACKAGES=""
BOOT_IMAGES=""
UFS_RW="userdata"
PANEL_SIZE=1080x2400
